---
- name: Create NPM main directory
  ansible.builtin.file:
    path: "{{ npm_directory }}"
    state: directory

- name: Create NPM data directory
  ansible.builtin.file:
    path: "{{ npm_directory }}/data"
    state: directory

- name: Create NPM letsencrypt directory
  ansible.builtin.file:
    path: "{{ npm_directory }}/letsencrypt"
    state: directory
